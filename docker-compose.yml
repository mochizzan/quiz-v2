# Every environment value lives in .env (git-ignored), copied from .env.example.
# Nothing here sets a value, so a deployment cannot silently run on a committed
# default.
services:
  db:
    image: mariadb:12.3
    # Server settings are part of the business contract, not tuning: utf8mb4 is
    # the only encoding the copy and names are valid in, +00:00 is the clock the
    # expiry rules assume, and strict mode turns a truncated value into an error
    # instead of silent data loss (OPS-233).
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+00:00
      - --sql-mode=STRICT_ALL_TABLES,NO_ENGINE_SUBSTITUTION,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    env_file: .env
    # Loopback-only mapping so host-side integration tests (TEST_DB_DSN toward
    # 127.0.0.1:3306, see the foundation plan §1) can reach the container.
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 12
  # One-shot schema and seed runner. A non-zero exit stops the deployment:
  # compose never starts the app, and the operator sees the reason instead of a
  # server whose every page is a 500.
  migrate:
    build: .
    # The image entrypoint is the server; the one-shot runner overrides it.
    entrypoint: ["./migrate", "bootstrap-teacher"]
    env_file: .env
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    env_file: .env
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
volumes:
  dbdata:
  uploads:
