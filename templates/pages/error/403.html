{{define "content"}}
{{with .Data}}
<div class="error-page-container type-403">
  <div class="error-header">
    <span class="error-type">Access Denied</span>
  </div>
  
  <div class="error-content">
    <div class="error-code-display">{{.Code}}</div>
    <h1 class="error-title">{{.Title}}</h1>
    <p class="error-message">{{.Message}}</p>
    
    <div class="permission-section">
      <div class="lock-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="10" rx="2" ry="2"></rect>
          <circle cx="12" cy="16" r="1"></circle>
          <path d="M7 11V7a5 5 0 0110 0v4"></path>
        </svg>
      </div>
      <p class="permission-note">Anda tidak memiliki izin akses yang diperlukan untuk melihat halaman ini.</p>
    </div>
  </div>
  
  <div class="error-actions">
    <a class="btn btn-solid theme-primary" href="{{.HomeHref}}">Kembali ke halaman masuk</a>
  </div>
</div>
{{end}}
{{end}}
