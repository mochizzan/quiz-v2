{{define "partials/empty-state.html"}}{{with .}}<div class="empty-panel">
  <span class="empty-icon"><svg width="26" height="26" aria-hidden="true"><use href="#i-{{.Icon}}"></use></svg></span>
  <h2>{{.Title}}</h2>
  {{if .Body}}<p>{{.Body}}</p>{{end}}
  {{with .Action}}<a class="btn {{if eq .Style "primary"}}btn-solid theme-primary{{else if eq .Style "danger"}}btn-outline theme-danger{{else}}btn-outline theme-primary{{end}}" href="{{.Href}}">{{.Label}}</a>{{end}}
</div>{{end}}{{end}}
