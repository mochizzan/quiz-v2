/* Sprite icon stroke contract: presentation attributes on the sprite root
   never reach <use> clones (they inherit from the use site), so without
   this every icon renders as a solid black fill. Outline icons, currentColor,
   1.8-unit round strokes — same contract the sprite root declares. */
use { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
