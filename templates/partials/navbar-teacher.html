{{define "partials/navbar-teacher.html"}}<nav class="app-nav" aria-label="Navigasi utama">
  <a class="app-brand" href="/teacher">
    <span class="app-brand-mark" aria-hidden="true">Q</span>
    <span class="app-brand-title">TWISTY <span class="app-brand-title-sub">QUIZ</span> <span class="app-badge-role">Guru</span></span>
  </a>
  <ul class="nav app-nav-links d-none lg:d-flex">
    <li class="nav-item"><a class="nav-link{{if eq .Active "dasbor"}} active{{end}}" href="/teacher"{{if eq .Active "dasbor"}} aria-current="page"{{end}}><svg width="16" height="16" aria-hidden="true"><use href="#i-dashboard"></use></svg>Dasbor</a></li>
    <li class="nav-item"><a class="nav-link{{if eq .Active "kuis"}} active{{end}}" href="/teacher/quizzes"{{if eq .Active "kuis"}} aria-current="page"{{end}}><svg width="16" height="16" aria-hidden="true"><use href="#i-quiz"></use></svg>Kuis</a></li>
    <li class="nav-item"><a class="nav-link{{if eq .Active "siswa"}} active{{end}}" href="/teacher/students"{{if eq .Active "siswa"}} aria-current="page"{{end}}><svg width="16" height="16" aria-hidden="true"><use href="#i-users"></use></svg>Siswa</a></li>
    <li class="nav-item"><a class="nav-link{{if eq .Active "penilaian"}} active{{end}}" href="/teacher/grading"{{if eq .Active "penilaian"}} aria-current="page"{{end}}><svg width="16" height="16" aria-hidden="true"><use href="#i-grade"></use></svg>Penilaian</a></li>
    <li class="nav-item"><a class="nav-link{{if eq .Active "pengaturan"}} active{{end}}" href="/teacher/teachers"{{if eq .Active "pengaturan"}} aria-current="page"{{end}}><svg width="16" height="16" aria-hidden="true"><use href="#i-settings"></use></svg>Pengaturan</a></li>
  </ul>
  <div class="app-nav-actions">

    {{with .User}}
    <div class="app-profile">
      <span class="app-avatar" aria-hidden="true">{{.Initials}}</span>
      <span class="app-profile-meta">
        <span class="app-profile-name">{{.FullName}}</span>
        <span class="app-profile-sub">{{.Role.Label}}</span>
      </span>
    </div>
    {{end}}
    <form method="post" action="/logout" class="d-inline-flex">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <button type="submit" class="btn app-icon-btn d-inline-flex" aria-label="Keluar" title="Keluar"><svg width="18" height="18" aria-hidden="true"><use href="#i-signout"></use></svg></button>
    </form>
    <button type="button" class="btn app-icon-btn d-inline-flex lg:d-none" data-bs-toggle="drawer" data-bs-target="#nav-drawer" aria-controls="nav-drawer" aria-label="Buka menu"><svg width="18" height="18" aria-hidden="true"><use href="#i-menu"></use></svg></button>
  </div>
</nav>{{end}}
