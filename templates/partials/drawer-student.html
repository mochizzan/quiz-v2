{{define "partials/drawer-student.html"}}<dialog class="drawer drawer-end app-drawer" id="nav-drawer-student" aria-label="Menu navigasi">
  <div class="drawer-header d-flex align-items-center justify-content-between gap-2">
    <span class="app-brand">
      <span class="app-brand-mark app-brand-mark-sm" aria-hidden="true">Q</span>
      <span class="app-brand-title">TWISTY <span class="app-brand-title-sub">QUIZ</span></span>
    </span>
    <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Tutup"></button>
  </div>
  <div class="drawer-body d-flex flex-column gap-4">
    <ul class="nav d-flex flex-column gap-2">
      <li class="nav-item"><a class="nav-link{{if eq .Active "dasbor"}} active{{end}}" href="/student"{{if eq .Active "dasbor"}} aria-current="page"{{end}}><svg width="18" height="18" aria-hidden="true"><use href="#i-dashboard"></use></svg>Dasbor</a></li>
      <li class="nav-item"><a class="nav-link{{if eq .Active "riwayat"}} active{{end}}" href="/student/history"{{if eq .Active "riwayat"}} aria-current="page"{{end}}><svg width="18" height="18" aria-hidden="true"><use href="#i-history"></use></svg>Riwayat</a></li>
      <li class="nav-item"><a class="nav-link{{if eq .Active "profil"}} active{{end}}" href="/profile"{{if eq .Active "profil"}} aria-current="page"{{end}}><svg width="18" height="18" aria-hidden="true"><use href="#i-person"></use></svg>Profil</a></li>
    </ul>
    <a class="btn btn-solid theme-primary" href="/join"><svg width="18" height="18" aria-hidden="true"><use href="#i-bolt"></use></svg>Gabung kuis</a>
    <form method="post" action="/logout">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <button type="submit" class="btn btn-outline theme-danger w-100"><svg width="18" height="18" aria-hidden="true"><use href="#i-signout"></use></svg>Keluar</button>
    </form>
  </div>
</dialog>{{end}}
